<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .carousel-container {
    position: relative;
    max-width: 900px; /* Adjust as needed */
    margin: 0 auto;
    overflow: hidden;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}

.carousel-slide {
    display: none; /* Hide all slides by default */
    width: 100%;
    text-align: center;
}

.carousel-slide.active {
    display: block; /* Show the active slide */
}

.carousel-slide img {
    width: 100%;
    height: auto;
    display: block;
    cursor: pointer; /* Indicate clickable */
    border-radius: 8px;
}

/* Navigation Arrows */
.prev-btn, .next-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background-color: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 1.5em;
    border-radius: 50%;
    z-index: 10;
}

.prev-btn {
    left: 10px;
}

.next-btn {
    right: 10px;
}

.prev-btn:hover, .next-btn:hover {
    background-color: rgba(0, 0, 0, 0.8);
}

/* Navigation Dots */
.carousel-dots {
    text-align: center;
    padding: 10px 0;
}

.dot {
    height: 10px;
    width: 10px;
    margin: 0 5px;
    background-color: #bbb;
    border-radius: 50%;
    display: inline-block;
    cursor: pointer;
    transition: background-color 0.3s ease;
}

.dot.active {
    background-color: #717171;
}

/* Overlay Styling */
.overlay {
    display: none; /* Hidden by default */
    position: fixed; /* Stay in place */
    z-index: 100; /* Sit on top */
    left: 0;
    top: 0;
    width: 100%; /* Full width */
    height: 100%; /* Full height */
    overflow: auto; /* Enable scroll if needed */
    background-color: rgba(0, 0, 0, 0.9); /* Black w/ opacity */
    justify-content: center;
    align-items: center;
}

.overlay.active {
    display: flex; /* Show when active */
}

.overlay-img {
    max-width: 90%;
    max-height: 90%;
    display: block;
    margin: auto;
}

.close-btn {
    position: absolute;
    top: 20px;
    right: 35px;
    color: #f1f1f1;
    font-size: 40px;
    font-weight: bold;
    transition: 0.3s;
    cursor: pointer;
}

.close-btn:hover,
.close-btn:focus {
    color: #bbb;
    text-decoration: none;
    cursor: pointer;
}
    </style>
</head>
<body>
    <div class="carousel-container">
    <div class="carousel-slide active">
        <img src="image1.jpg" alt="Image 1">
    </div>
    <div class="carousel-slide">
        <img src="image2.jpg" alt="Image 2">
    </div>
    <div class="carousel-slide">
        <img src="image3.jpg" alt="Image 3">
    </div>
    <div class="carousel-dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
    </div>
    <button class="prev-btn">&lt;</button>
    <button class="next-btn">&gt;</button>
</div>

<div id="overlay" class="overlay">
    <span class="close-btn">&times;</span>
    <img id="overlay-img" src="" alt="Overlay Image">
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
    const slides = document.querySelectorAll('.carousel-slide');
    const dots = document.querySelectorAll('.dot');
    const prevBtn = document.querySelector('.prev-btn');
    const nextBtn = document.querySelector('.next-btn');
    const overlay = document.getElementById('overlay');
    const overlayImg = document.getElementById('overlay-img');
    const closeBtn = document.querySelector('.close-btn');

    let currentSlide = 0;

    function showSlide(index) {
        slides.forEach((slide, i) => {
            slide.classList.remove('active');
            dots[i].classList.remove('active');
        });
        slides[index].classList.add('active');
        dots[index].classList.add('active');
        currentSlide = index;
    }

    function nextSlide() {
        currentSlide = (currentSlide + 1) % slides.length;
        showSlide(currentSlide);
    }

    function prevSlide() {
        currentSlide = (currentSlide - 1 + slides.length) % slides.length;
        showSlide(currentSlide);
    }

    // Carousel Navigation
    nextBtn.addEventListener('click', nextSlide);
    prevBtn.addEventListener('click', prevSlide);

    dots.forEach((dot, index) => {
        dot.addEventListener('click', () => showSlide(index));
    });

    // Image Click to Open Overlay
    slides.forEach(slide => {
        slide.querySelector('img').addEventListener('click', (event) => {
            overlay.classList.add('active');
            overlayImg.src = event.target.src;
        });
    });

    // Close Overlay
    closeBtn.addEventListener('click', () => {
        overlay.classList.remove('active');
        overlayImg.src = ''; // Clear image source
    });

    overlay.addEventListener('click', (event) => {
        if (event.target === overlay) { // Close if clicked outside the image
            overlay.classList.remove('active');
            overlayImg.src = '';
        }
    });

    // Initialize the first slide
    showSlide(currentSlide);
});
</script>
</body>
</html>
